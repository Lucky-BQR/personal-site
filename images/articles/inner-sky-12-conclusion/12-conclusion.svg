<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1050" viewBox="0 0 640 1050" role="img" aria-labelledby="title desc">
<title id="title">让反馈改变解释</title><desc id="desc">本次阅读改编的实践循环：记录事实，提出暂定解释，自主选择小行动，观察实际反馈，再修订或停止。允许不符合的结果推翻解释。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#315d4f" stroke-width="1.7"/></marker></defs>
<rect width="640" height="1050" rx="24" fill="#f7f5ef"/>
<text x="32" y="50" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">内在的天空  /  第 12 章</text>
<text x="32" y="110" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#24362f" text-anchor="start">让反馈改变解释</text>
<text x="32" y="156" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">阅读改编：地图必须接受现实纠正</text>
<line x1="32" y1="182" x2="608" y2="182" stroke="#cbd7c9" stroke-width="2"/>
<rect x="76" y="212" width="532" height="115" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<text x="100" y="254" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">事实</text>
<text x="100" y="298" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">发生了什么？</text>
<line x1="342" y1="333" x2="342" y2="342" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="349" width="532" height="115" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<text x="100" y="391" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">暂定解释</text>
<text x="100" y="435" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">也写下可能不适合的条件</text>
<line x1="342" y1="470" x2="342" y2="479" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="486" width="532" height="115" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<text x="100" y="528" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">小行动</text>
<text x="100" y="572" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">由当事人自愿选择</text>
<line x1="342" y1="607" x2="342" y2="616" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="623" width="532" height="115" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<text x="100" y="665" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">实际反馈</text>
<text x="100" y="709" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">有效、无效、相反或不明</text>
<line x1="342" y1="744" x2="342" y2="753" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="760" width="532" height="115" rx="20" fill="#e7ede3" stroke="#cbd7c9" stroke-width="2"/>
<text x="100" y="802" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">修订或停止</text>
<text x="100" y="846" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">不要求事实迁就解释</text>
<path d="M76 817 H46 V263 H66" fill="none" stroke="#315d4f" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<line x1="32" y1="918" x2="608" y2="918" stroke="#cbd7c9" stroke-width="2"/>
<text x="32" y="960" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">这是练习闭环，不是占星效力证明</text>
<text x="32" y="1002" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#315d4f" text-anchor="start">阅读整理 · 作者的象征体系</text>
</svg>
