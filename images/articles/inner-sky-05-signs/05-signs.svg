<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc">
<title id="title">长处怎样变成遮挡物</title><desc id="desc">目标、策略、资源、阴影四层阅读框架。箭头是检查顺序：先问想发展什么，再问怎样做、可以借助什么，以及何时偏离。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#315d4f" stroke-width="1.7"/></marker></defs>
<rect width="640" height="1010" rx="24" fill="#f7f5ef"/>
<text x="32" y="50" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">内在的天空  /  第 05 章</text>
<text x="32" y="110" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#24362f" text-anchor="start">长处怎样变成遮挡物</text>
<text x="32" y="156" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">把目标、手段与副作用分开看</text>
<line x1="32" y1="182" x2="608" y2="182" stroke="#cbd7c9" stroke-width="2"/>
<rect x="32" y="210" width="576" height="132" rx="20" fill="#e7ede3" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="255" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="265" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="115" y="258" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">目标</text>
<text x="58" y="302" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">真正想发展什么？</text>
<line x1="320" y1="350" x2="320" y2="363" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="372" width="576" height="132" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="417" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="427" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="115" y="420" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">策略</text>
<text x="58" y="464" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">靠哪些行为接近目标？</text>
<line x1="320" y1="512" x2="320" y2="525" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="534" width="576" height="132" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="579" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="589" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="115" y="582" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">资源</text>
<text x="58" y="626" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">哪些能力可以借助？</text>
<line x1="320" y1="674" x2="320" y2="687" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="696" width="576" height="132" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="741" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="751" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="115" y="744" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">阴影</text>
<text x="58" y="788" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">这些能力何时开始偏离？</text>
<text x="320" y="857" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="middle">善于照顾别人 ≠ 已经坦露自己</text>
<line x1="32" y1="878" x2="608" y2="878" stroke="#cbd7c9" stroke-width="2"/>
<text x="32" y="920" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">四层反思卡为本次阅读改编</text>
<text x="32" y="962" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#315d4f" text-anchor="start">阅读整理 · 作者的象征体系</text>
</svg>
