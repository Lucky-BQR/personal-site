<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110" role="img" aria-labelledby="title desc">
<title id="title">五步组成一段解释</title><desc id="desc">本书第八章的五步阅读顺序：辨认行星功能，找星座目的，找建设性路径，找偏离路径，最后加入宫位的生活情境。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#315d4f" stroke-width="1.7"/></marker></defs>
<rect width="640" height="1110" rx="24" fill="#f7f5ef"/>
<text x="32" y="50" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">内在的天空  /  第 08 章</text>
<text x="32" y="110" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#24362f" text-anchor="start">五步组成一段解释</text>
<text x="32" y="156" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">建设性与失衡路径必须成对出现</text>
<line x1="32" y1="182" x2="608" y2="182" stroke="#cbd7c9" stroke-width="2"/>
<rect x="32" y="210" width="576" height="122" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="255" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="265" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="115" y="258" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">辨认行星功能</text>
<text x="58" y="302" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">正在讨论什么需要或能力？</text>
<line x1="320" y1="339" x2="320" y2="350" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="358" width="576" height="122" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="403" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="413" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="115" y="406" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">找星座目的</text>
<text x="58" y="450" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">这种功能想向哪里发展？</text>
<line x1="320" y1="487" x2="320" y2="498" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="506" width="576" height="122" rx="20" fill="#e7ede3" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="551" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="561" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="115" y="554" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">找建设性路径</text>
<text x="58" y="598" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">有哪些资源和可选择行为？</text>
<line x1="320" y1="635" x2="320" y2="646" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="654" width="576" height="122" rx="20" fill="#e7ede3" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="699" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="709" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="115" y="702" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">找偏离路径</text>
<text x="58" y="746" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">同一需要可能怎样失衡？</text>
<line x1="320" y1="783" x2="320" y2="794" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="802" width="576" height="122" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="847" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="857" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="115" y="850" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">加入宫位情境</text>
<text x="58" y="894" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">两条路径在哪类场景发生？</text>
<line x1="32" y1="978" x2="608" y2="978" stroke="#cbd7c9" stroke-width="2"/>
<text x="32" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">依原书顺序整理；风险不是预言</text>
<text x="32" y="1062" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#315d4f" text-anchor="start">阅读整理 · 作者的象征体系</text>
</svg>
