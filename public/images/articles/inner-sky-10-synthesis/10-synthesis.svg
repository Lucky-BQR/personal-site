<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1130" viewBox="0 0 640 1130" role="img" aria-labelledby="title desc">
<title id="title">整合之前，先排次序</title><desc id="desc">第十章的六阶段次序：日月上升、半球分布、焦点行星、交点与整体、重复主题及冲突、普通语言和行动。重点不意味着删掉矛盾。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#315d4f" stroke-width="1.7"/></marker></defs>
<rect width="640" height="1130" rx="24" fill="#f7f5ef"/>
<text x="32" y="50" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">内在的天空  /  第 10 章</text>
<text x="32" y="110" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#24362f" text-anchor="start">整合之前，先排次序</text>
<text x="32" y="156" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">从轮廓走向细节，最后回到人的问题</text>
<line x1="32" y1="182" x2="608" y2="182" stroke="#cbd7c9" stroke-width="2"/>
<rect x="32" y="210" width="576" height="112" rx="20" fill="#e7ede3" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="255" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="265" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="115" y="258" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">太阳、月亮、上升</text>
<text x="58" y="302" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">先建立可修订的大轮廓</text>
<line x1="320" y1="328" x2="320" y2="333" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="340" width="576" height="112" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="385" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="395" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="115" y="388" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">半球分布</text>
<text x="58" y="432" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">暂放词义，观察整体分布</text>
<line x1="320" y1="458" x2="320" y2="463" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="470" width="576" height="112" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="515" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="525" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="115" y="518" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">焦点行星</text>
<text x="58" y="562" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">说明先讨论它的理由</text>
<line x1="320" y1="588" x2="320" y2="593" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="600" width="576" height="112" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="645" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="655" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="115" y="648" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">交点与整体</text>
<text x="58" y="692" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">比较旧模式与发展方向</text>
<line x1="320" y1="718" x2="320" y2="723" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="730" width="576" height="112" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="775" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="785" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="115" y="778" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">重复主题与冲突</text>
<text x="58" y="822" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">少数矛盾也要保留</text>
<line x1="320" y1="848" x2="320" y2="853" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="860" width="576" height="112" rx="20" fill="#e7ede3" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="905" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="915" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="115" y="908" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">回到普通语言</text>
<text x="58" y="952" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">说清真实问题、选择与行动</text>
<line x1="32" y1="998" x2="608" y2="998" stroke="#cbd7c9" stroke-width="2"/>
<text x="32" y="1040" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">这是解释顺序，不是准确性的保证</text>
<text x="32" y="1082" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#315d4f" text-anchor="start">阅读整理 · 作者的象征体系</text>
</svg>
