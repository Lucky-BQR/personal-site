<svg xmlns="http://www.w3.org/2000/svg" width="640" height="810" viewBox="0 0 640 810" role="img" aria-labelledby="title desc">
<title id="title">解释的三层语法</title><desc id="desc">行星提供心理功能，星座提供目标与策略，宫位提供发生的生活领域；三者是作者象征体系中的解释语法。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#315d4f" stroke-width="1.7"/></marker></defs>
<rect width="640" height="810" rx="24" fill="#f7f5ef"/>
<text x="32" y="50" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">内在的天空  /  第 02 章</text>
<text x="32" y="110" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#24362f" text-anchor="start">解释的三层语法</text>
<text x="32" y="156" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">三种信息分工，才能组成一句话</text>
<line x1="32" y1="182" x2="608" y2="182" stroke="#cbd7c9" stroke-width="2"/>
<rect x="32" y="210" width="576" height="132" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="255" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="265" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="115" y="258" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">行星  /  什么功能</text>
<text x="58" y="302" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">感受、沟通、关系或行动？</text>
<line x1="320" y1="350" x2="320" y2="374" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="384" width="576" height="132" rx="20" fill="#e7ede3" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="429" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="439" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="115" y="432" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">星座  /  为什么与如何</text>
<text x="58" y="476" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">想发展什么，怎样表达？</text>
<line x1="320" y1="524" x2="320" y2="548" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="558" width="576" height="108" rx="20" fill="#ffffff" stroke="#cbd7c9" stroke-width="2"/>
<circle cx="76" cy="603" r="22" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="76" y="613" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="115" y="606" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">宫位  /  在哪里</text>
<text x="58" y="650" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">放回某个具体生活领域</text>
<line x1="32" y1="678" x2="608" y2="678" stroke="#cbd7c9" stroke-width="2"/>
<text x="32" y="720" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">这是组合语法，不是因果链</text>
<text x="32" y="762" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#315d4f" text-anchor="start">阅读整理 · 作者的象征体系</text>
</svg>
