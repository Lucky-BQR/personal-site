<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1130" viewBox="0 0 640 1130" role="img" aria-labelledby="title desc">
<title id="title">相位：定义与解释分开</title><desc id="desc">五种主要相位的几何角度与作者解释：合相0度一起启动，相冲180度两端拉扯，相刑90度持续摩擦，三合120度自然配合，六合60度相互激发。图形不是因果机制。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#315d4f" stroke-width="1.7"/></marker></defs>
<rect width="640" height="1130" rx="24" fill="#f7f5ef"/>
<text x="32" y="50" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">内在的天空  /  第 09 章</text>
<text x="32" y="110" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#24362f" text-anchor="start">相位：定义与解释分开</text>
<text x="32" y="156" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">角度可核对，心理含义属作者解释</text>
