<text x="32" y="1040" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#607367" text-anchor="start">先看互动，再同时检查收益与代价</text>
<text x="32" y="1082" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#315d4f" text-anchor="start">阅读整理 · 作者的象征体系</text>
