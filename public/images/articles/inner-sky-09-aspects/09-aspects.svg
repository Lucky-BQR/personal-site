<circle cx="107" cy="431" r="4" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="188" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">相冲  180°</text>
<text x="188" y="463" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">两端拉扯，容纳双方</text>
