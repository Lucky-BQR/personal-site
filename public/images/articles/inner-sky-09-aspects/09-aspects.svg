<circle cx="107" cy="277" r="4" fill="#315d4f" stroke="#315d4f" stroke-width="0"/>
<text x="188" y="261" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#315d4f" text-anchor="start">合相  0°</text>
<text x="188" y="309" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#24362f" text-anchor="start">一起启动，也需区分</text>
